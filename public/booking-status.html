<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Status Booking — Kost Shukoh</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563EB'><path d='M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z'/></svg>">
  <script>
    (function() {
      const saved = localStorage.getItem('kms_theme');
      if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="bg-surface-canvas text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- HEADER -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 transition-colors duration-200">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-900 text-white flex items-center justify-center font-bold text-sm">KS</div>
        <span class="font-bold text-slate-900 dark:text-white text-base">Kost Shukoh</span>
      </a>
      <div class="flex items-center gap-3">
        <!-- Theme Toggle -->
        <button type="button" id="theme-toggle" data-theme-toggle="true" class="theme-toggle-btn" title="Beralih ke Tema Gelap (Dark Mode)" aria-label="Ganti Tema">
          <svg class="w-5 h-5 text-slate-700 dark:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <a href="../index.html" class="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:text-brand-700 flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          Kembali ke Beranda
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 py-10 px-4">
    <div class="max-w-xl mx-auto space-y-6">

      <div class="text-center">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Pelacakan Status Booking</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Masukkan kode booking yang Anda terima saat mengirimkan formulir.</p>
      </div>

      <!-- SEARCH CARD -->
      <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-card dark:shadow-none">
        <form id="search-form" class="flex gap-2">
          <input type="text" id="booking-code-input" required placeholder="Contoh: BSHK-8921" class="input-field uppercase font-mono tracking-wider">
          <button type="submit" class="btn-primary px-5 shrink-0">
            Cari Status
          </button>
        </form>
      </div>

      <!-- RESULT CARD -->
      <div id="result-container" class="hidden">
        <!-- Rendered by JS -->
      </div>

      <!-- NOT FOUND CARD -->
      <div id="notfound-container" class="hidden bg-white dark:bg-slate-900 p-8 rounded-2xl border border-slate-200 dark:border-slate-800 text-center shadow-card dark:shadow-none">
        <div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h3 class="font-bold text-slate-900 dark:text-white text-base">Kode Booking Tidak Ditemukan</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-sm mx-auto">Pastikan kode yang dimasukkan sudah benar (format: BSHK-XXXX) atau hubungi pengelola jika ada kendala.</p>
      </div>

    </div>
  </main>

  <script type="module">
    import { api } from '../src/js/api.js';
    import { formatTanggal, getStatusBadge } from '../src/js/ui.js';
    import { initTheme } from '../src/js/theme.js';

    // Inisialisasi Tema Gelap/Terang
    initTheme();

    const form = document.getElementById('search-form');
    const input = document.getElementById('booking-code-input');
    const resultBox = document.getElementById('result-container');
    const notFoundBox = document.getElementById('notfound-container');

    async function checkBooking(code) {
      if (!code) return;
      input.value = code.toUpperCase();
      resultBox.classList.add('hidden');
      notFoundBox.classList.add('hidden');

      try {
        const res = await api.get(`/public/bookings/status/${code.trim()}`);
        if (res.success && res.data) {
          renderResult(res.data);
        } else {
          notFoundBox.classList.remove('hidden');
        }
      } catch (err) {
        notFoundBox.classList.remove('hidden');
      }
    }

    function renderResult(b) {
      resultBox.classList.remove('hidden');
      resultBox.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-card dark:shadow-none p-6 space-y-5 text-slate-900 dark:text-white">
          <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
            <div>
              <span class="text-[11px] font-semibold text-slate-400 dark:text-slate-400 uppercase tracking-wider block">Nomor Registrasi</span>
              <span class="text-xl font-extrabold text-slate-900 dark:text-white font-mono">${b.booking_code}</span>
            </div>
            <div>
              ${getStatusBadge(b.status, 'booking')}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4 text-xs">
            <div>
              <span class="text-slate-400 dark:text-slate-400 block mb-0.5">Nama Pemohon</span>
              <span class="font-bold text-slate-800 dark:text-slate-200 text-sm">${b.applicant_name}</span>
            </div>
            <div>
              <span class="text-slate-400 dark:text-slate-400 block mb-0.5">Kamar Dipesan</span>
              <span class="font-bold text-brand-600 dark:text-brand-400 text-sm">Kamar ${b.room_code}</span>
            </div>
            <div>
              <span class="text-slate-400 dark:text-slate-400 block mb-0.5">Rencana Masuk</span>
              <span class="font-medium text-slate-700 dark:text-slate-300">${formatTanggal(b.planned_start_date)}</span>
            </div>
            <div>
              <span class="text-slate-400 dark:text-slate-400 block mb-0.5">Durasi Sewa</span>
              <span class="font-medium text-slate-700 dark:text-slate-300">${b.duration_months} Bulan</span>
            </div>
            <div>
              <span class="text-slate-400 dark:text-slate-400 block mb-0.5">Jumlah Calon Penghuni</span>
              <span class="font-medium text-slate-700 dark:text-slate-300">${b.occupant_count} Orang</span>
            </div>
            <div>
              <span class="text-slate-400 dark:text-slate-400 block mb-0.5">Waktu Pengajuan</span>
              <span class="font-medium text-slate-700 dark:text-slate-300">${formatTanggal(b.created_at)}</span>
            </div>
          </div>

          ${b.admin_note ? `
            <div class="p-4 rounded-xl bg-blue-50/70 dark:bg-blue-950/40 border border-blue-200/60 dark:border-blue-800/60 text-xs">
              <span class="font-bold text-blue-900 dark:text-blue-200 block mb-1">Catatan dari Pengelola:</span>
              <p class="text-blue-800 dark:text-blue-300 leading-relaxed">${b.admin_note}</p>
            </div>
          ` : `
            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400 text-xs">
              Pengajuan Anda sedang dalam antrean peninjauan oleh pengelola. Harap tunggu konfirmasi lebih lanjut.
            </div>
          `}

          <div class="pt-2 flex items-center justify-between border-t border-slate-100 dark:border-slate-800">
            <span class="text-xs text-slate-400">Butuh bantuan cepat?</span>
            <a href="https://wa.me/6281234567890?text=Halo%20Pengelola%20Kost%20Shukoh,%20saya%20ingin%20menanyakan%20status%20booking%20${b.booking_code}" target="_blank" class="btn-secondary text-xs px-3.5 py-2">
              Hubungi via WhatsApp
            </a>
          </div>
        </div>
      `;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      checkBooking(input.value);
    });

    // Check URL params
    const params = new URLSearchParams(window.location.search);
    if (params.get('code')) {
      checkBooking(params.get('code'));
    }
  </script>
</body>
</html>
